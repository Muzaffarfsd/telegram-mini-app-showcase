name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up supported Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the exact dependency lock without lifecycle scripts
        run: npm ci --include=dev --ignore-scripts
      - name: Check tracked source for credentials
        run: npm run secretcheck
      - name: Run security regression tests
        run: npm run check:security && npm run test:security
        env:
          NODE_ENV: test
      - name: Build the app and all bundled demos
        run: npm run build
      - name: Audit the complete dependency tree
        run: npm run audit:security
