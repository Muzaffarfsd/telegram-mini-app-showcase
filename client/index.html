    // Telegram supplies these parameters in the fragment, or in the session on reload.
    (function () {
      var launch = new URLSearchParams(location.hash.slice(1));
      var stored = {};
      try { stored = JSON.parse(sessionStorage.getItem('__telegram__initParams') || '{}') || {}; } catch (e) {}
      var platform = launch.get('tgWebAppPlatform') || stored.tgWebAppPlatform;
      var version = launch.get('tgWebAppVersion') || stored.tgWebAppVersion;

       does NOT reflow when the bot header collapses. */
    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100lvh;
      min-height: var(--tg-viewport-stable-height, 100lvh);
      overflow-x: hidden;
      /* CRITICAL: Same background on html prevents different colored footer area */
      background: var(--bg);
    }

    #root {
      width: 100%;
      min-height: 100vh;
      min-height: 100lvh;
      min-height: var(--tg-viewport-stable-height, 100lvh);
    }

  </style>

  <script>
    if('scrollRestoration' in history) history.scrollRestoration='manual';
    window.scrollTo(0,0);
    document.getElementById('telegram-sdk').addEventListener('load', function () {
      if (!window.Telegram || !window.Telegram.WebApp) return;
      var __htmlEl = document.documentElement;
      var tg=window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      /* Reserve space for the native controls while fullscreen settles. */
      try{
        if(typeof tg.requestFullscreen==='function' && (!tg.isVersionAtLeast || tg.isVersionAtLeast('8.0'))){
          tg.requestFullscreen();
          __htmlEl.dataset.tgFullscreen='1';
          __htmlEl.style.setProperty('--csat','54px');
        }
      }catch(e){}
      try{
        var __bootColor = (__htmlEl.classList.contains('light-route-transition') || __htmlEl.classList.contains('studio-home-theme') || __htmlEl.classList.contains('demo-boot-theme')) ? '#ffffff' : '#000000';
        if(typeof tg.setBottomBarColor==='function') tg.setBottomBarColor(__bootColor);
        if(typeof tg.setBackgroundColor==='function') tg.setBackgroundColor(__bootColor);
        if(typeof tg.setHeaderColor==='function') tg.setHeaderColor(__bootColor);
      }catch(e){}

      function syncViewport() {
        var height = tg.viewportHeight || window.innerHeight;
        __htmlEl.style.setProperty('--tg-viewport-height', height + 'px');
        __htmlEl.style.setProperty('--tg-viewport-stable-height', (tg.viewportStableHeight || height) + 'px');
        __htmlEl.style.setProperty('--tg-viewport-width', window.innerWidth + 'px');
      }
      syncViewport();
      tg.onEvent('viewportChanged', syncViewport);
      setTimeout(function(){ tg.expand(); }, 100);
      setTimeout(function(){ tg.expand(); }, 300);
    }, { once: true });
  </script>
