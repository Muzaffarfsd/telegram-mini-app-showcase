[phases.setup]
nixPkgs = ["nodejs_24"]
# Reviewed nixos-26.05 package set: Node.js 24.22.1, rather than Nixpacks' older default archive.
nixpkgsArchive = "c56a87d8e41ce69bd2af57eb35dcc117a9dfca33"

[phases.install]
cmds = ["npm ci --include=dev --ignore-scripts"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"

[variables]
NODE_ENV = "production"
